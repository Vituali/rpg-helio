# docker-compose.yml — HELIO
#
# Dois serviços:
#   caddy → serve o front buildado e faz o proxy do WebSocket (única porta pública)
#   app   → servidor autoritativo do jogo (Node + Socket.IO), interno
#
# Uso:  docker compose up -d --build
#       docker compose logs -f
#       docker compose down

services:
  app:
    build:
      context: ..                        # raiz do repo (usa server/ e shared/)
      dockerfile: server/Dockerfile
    container_name: helio-app
    environment:
      - PORT=3000
      - ROOM_CODE=${ROOM_CODE:-HELIO}    # sala padrão
      - ORIGIN=${ORIGIN:-*}              # CORS; "*" basta pois tudo passa pelo Caddy
      # Senha para entrar como MESTRE. Vazio = qualquer um vira mestre, o que só
      # é aceitável em rede local. Ponha uma senha antes de expor à internet.
      - GM_KEY=${GM_KEY:-}
    expose:
      - "3000"                           # interno: NÃO publicar no host
    restart: unless-stopped
    # NÃO adicione `ports:` aqui. Só o Caddy fala com o mundo.

  caddy:
    build:
      context: ..                        # raiz do repo
      dockerfile: deploy/Dockerfile      # builda o front e serve com Caddy
    image: helio:latest
    container_name: helio-caddy
    depends_on:
      - app
    environment:
      # Endereço público — o único botão que importa. Padrão ":80": HTTP em
      # qualquer host, funciona em localhost e na rede local sem DNS.
      # Para HTTPS automático, use um domínio (ver deploy/.env.example).
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      # IPv4 para o mundo (é o que o port forwarding usa), e IPv6 SÓ no
      # loopback. O motivo é importante: IPv6 não tem NAT, então publicar em
      # "[::]" deixa a máquina acessível da internet inteira SEM port
      # forwarding nenhum — foi o que aconteceu aqui (ver DECISOES.md #13).
      # O loopback IPv6 fica para "http://localhost" continuar funcionando.
      - "0.0.0.0:80:80"      # HTTP + desafio ACME (Let's Encrypt)
      - "0.0.0.0:443:443"    # HTTPS
      - "0.0.0.0:443:443/udp"  # HTTP/3
      - "[::1]:80:80"        # só localhost, nunca da rede
      - "[::1]:443:443"
      - "[::1]:443:443/udp"
    volumes:
      - caddy_data:/data                # certificados TLS (persistir!)
      - caddy_config:/config
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # OPCIONAL — atualizador de DDNS (só para a Opção A: DuckDNS + port forward).
  # O IP residencial muda; isto mantém o registro em dia.
  # ───────────────────────────────────────────────────────────────────────────
  # duckdns:
  #   image: linuxserver/duckdns:latest
  #   container_name: helio-duckdns
  #   environment:
  #     - SUBDOMAINS=helio
  #     - TOKEN=${DUCKDNS_TOKEN}
  #   restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
