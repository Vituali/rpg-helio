# docker-compose.yml — HELIO
#
# HOJE: sobe o Caddy servindo o front buildado (client/dist).
# FASE 2: adicione o serviço `app` (Node + Socket.IO) e descomente o proxy
#         /socket.io no Caddyfile.
#
# Uso:  docker compose up -d --build
#       docker compose logs -f
#       docker compose down

services:
  caddy:
    build:
      context: ..                        # raiz do repo
      dockerfile: deploy/Dockerfile      # builda o front e serve com Caddy
    image: helio:latest
    container_name: helio-caddy
    ports:
      - "80:80"          # desafio ACME (Let's Encrypt)
      - "443:443"        # HTTPS
      - "443:443/udp"    # HTTP/3
    volumes:
      - caddy_data:/data                # certificados TLS (persistir!)
      - caddy_config:/config
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
    #   interval: 15s
    #   timeout: 3s
    #   retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # FASE 2 — servidor autoritativo. Descomente quando existir `server/`.
  # ───────────────────────────────────────────────────────────────────────────
  # app:
  #   build:
  #     context: ../server
  #     dockerfile: Dockerfile
  #   container_name: helio-app
  #   environment:
  #     - PORT=3000
  #     - ROOM_CODE=${ROOM_CODE:-HELIO}
  #     - ORIGIN=${ORIGIN:-https://helio.duckdns.org}
  #   volumes:
  #     - app_data:/data                  # persistência das salas/campanhas
  #   expose:
  #     - "3000"                          # interno: NÃO publicar no host
  #   restart: unless-stopped
  #   # NÃO adicione `ports:` aqui. Só o Caddy fala com o mundo.

  # ───────────────────────────────────────────────────────────────────────────
  # OPCIONAL — atualizador de DDNS (só para a Opção A: DuckDNS + port forward).
  # O IP residencial muda; isto mantém o registro em dia.
  # ───────────────────────────────────────────────────────────────────────────
  # duckdns:
  #   image: linuxserver/duckdns:latest
  #   container_name: helio-duckdns
  #   environment:
  #     - SUBDOMAINS=helio
  #     - TOKEN=${DUCKDNS_TOKEN}
  #   restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
