# docker-compose.yml — HELIO
#
# Dois serviços:
#   caddy → serve o front buildado e faz o proxy do WebSocket (única porta pública)
#   app   → servidor autoritativo do jogo (Node + Socket.IO), interno
#
# Uso:  docker compose up -d --build
#       docker compose logs -f
#       docker compose down

services:
  app:
    build:
      context: ..                        # raiz do repo (usa server/ e shared/)
      dockerfile: server/Dockerfile
    container_name: helio-app
    environment:
      - PORT=3000
      - ROOM_CODE=${ROOM_CODE:-HELIO}    # sala padrão
      - ORIGIN=${ORIGIN:-*}              # CORS; "*" basta pois tudo passa pelo Caddy
      # Senha para entrar como MESTRE. Vazio = qualquer um vira mestre, o que só
      # é aceitável em rede local. Ponha uma senha antes de expor à internet.
      - GM_KEY=${GM_KEY:-}
      # Limite de taxa por conexão (eventos por segundo e rajada). Os padrões
      # são ~15x o uso legítimo; só mexa se tiver motivo. Ver ADR #15.
      - RATE_PER_SEC=${RATE_PER_SEC:-60}
      - RATE_BURST=${RATE_BURST:-150}
    expose:
      - "3000"                           # interno: NÃO publicar no host
    # ── Endurecimento do container ──
    # Nada é escrito em disco (as salas vivem em memória), então o filesystem
    # pode ser somente-leitura e o processo perde TODAS as capabilities. O /tmp
    # vira tmpfs porque o Node precisa de um lugar gravável. Junto com o
    # `USER node` do server/Dockerfile, é o que reduz o estrago se alguém
    # conseguir executar código aqui dentro. Ver ADR #15.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # NÃO adicione `ports:` aqui. Só o Caddy fala com o mundo.

  caddy:
    build:
      context: ..                        # raiz do repo
      dockerfile: deploy/Dockerfile      # builda o front e serve com Caddy
    image: helio:latest
    container_name: helio-caddy
    depends_on:
      - app
    environment:
      # Endereço público — o único botão que importa. Padrão ":80": HTTP em
      # qualquer host, funciona em localhost e na rede local sem DNS.
      # Para HTTPS automático, use um domínio (ver deploy/.env.example).
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      # IPv4 para o mundo (é o que o port forwarding usa), e IPv6 SÓ no
      # loopback. O motivo é importante: IPv6 não tem NAT, então publicar em
      # "[::]" deixa a máquina acessível da internet inteira SEM port
      # forwarding nenhum — foi o que aconteceu aqui (ver DECISOES.md #13).
      # O loopback IPv6 fica para "http://localhost" continuar funcionando.
      - "0.0.0.0:80:80"      # HTTP + desafio ACME (Let's Encrypt)
      - "0.0.0.0:443:443"    # HTTPS
      - "0.0.0.0:443:443/udp"  # HTTP/3
      - "[::1]:80:80"        # só localhost, nunca da rede
      - "[::1]:443:443"
      - "[::1]:443:443/udp"
    volumes:
      - caddy_data:/data                # certificados TLS (persistir!)
      - caddy_config:/config
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # OPCIONAL — acesso público SEM abrir porta e SEM tocar no roteador.
  #
  # O cloudflared abre uma conexão de SAÍDA para a Cloudflare e o mundo entra
  # por lá. Consequências, que são exatamente o que se quer:
  #   - nenhuma porta de entrada aberta (o PC nunca fica escutando na internet);
  #   - seu IP de casa não aparece para quem visita;
  #   - funciona atrás de CGNAT e de roteador alheio — zero configuração;
  #   - HTTPS de graça (a Cloudflare termina o TLS na borda);
  #   - o jogador só clica no link, não instala nada.
  #
  # Modo rápido (sem conta, sem domínio): a URL é aleatória
  # (https://algo-aleatorio.trycloudflare.com) e troca quando o container
  # reinicia. Como é um subdomínio de certificado coringa, ele NÃO entra no log
  # de Certificate Transparency — ou seja, é um link não-listado, que ninguém
  # acha por varredura. Ótimo para teste e apresentação.
  #
  # Uso:  docker compose --profile tunnel up -d
  #       docker compose logs cloudflared        # mostra a URL
  # ───────────────────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: helio-tunnel
    profiles: ["tunnel"]
    depends_on:
      - caddy
    command: tunnel --no-autoupdate --url http://caddy:80
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # OPCIONAL — atualizador de DDNS (só para a Opção A: DuckDNS + port forward).
  # O IP residencial muda; isto mantém o registro em dia.
  # ───────────────────────────────────────────────────────────────────────────
  # duckdns:
  #   image: linuxserver/duckdns:latest
  #   container_name: helio-duckdns
  #   environment:
  #     - SUBDOMAINS=helio
  #     - TOKEN=${DUCKDNS_TOKEN}
  #   restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
